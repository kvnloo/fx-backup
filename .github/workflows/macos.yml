name: macOS

# Scratch branch only: repeats the five subagent gap wait tests on a macOS
# runner. Never merge this file.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeat:
    name: Repeat the subagent gap wait tests
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.17.1"
          use-cache: false

      - name: Build only the gap tests
        run: zig build install-test -Doptimize=ReleaseSafe -Dtest-filter="a wait that starts as"

      - name: Run them 1,000 times, four at a time
        run: |
          set -u
          mkdir -p fail-logs
          run_batch() {
            for i in $(seq 1 250); do
              log="run-$1-$i.log"
              if ./zig-out/bin/fx-test >"$log" 2>&1; then rm -f "$log"; else mv "$log" fail-logs/; fi
            done
          }
          for worker in 1 2 3 4; do run_batch "$worker" & done
          wait
          failures=$(ls fail-logs | wc -l | tr -d ' ')
          echo "runs=1000 failures=$failures"
          for f in fail-logs/*.log; do [ -e "$f" ] || continue; echo "== $f"; cat "$f"; done
          [ "$failures" = 0 ]

      - name: Keep the failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gap-test-failures
          path: fail-logs/
          if-no-files-found: ignore
